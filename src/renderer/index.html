  <!-- 7 张外部样式表（原 6 张 + motion.css）。启动动画仍内联在 <head>，首帧不依赖它们。 -->
  <title data-i18n="3MF模型管理器 · 本地 3MF 模型库">3MF模型管理器 · 本地 3MF 模型库</title>
  <!--
    启动动画：内联在 <head> 里，HTML 一解析就能画出来，不等 7 张外部样式表 / ES Modules。
    纯 CSS（transform + opacity），无图片、无 JS 定时器，不阻塞后端初始化。
    12 秒后有一层纯 CSS 自动隐藏兜底：即便脚本整体加载失败，也不会留下挡住界面的遮罩。
  -->
  <style>
    #boot-splash {
      position: fixed; inset: 0; z-index: 9999;
      display: grid; place-items: center;
      background: #f5f7fa; color: #1e293b;
      font-family: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
      /* 纯视觉层：不拦截任何点击，启动流程与用户操作都不被它阻塞 */
      pointer-events: none;
      transition: opacity .28s ease, transform .28s ease;
      animation: boot-autohide .01s linear 12s forwards;
    }
    html[data-theme="dark"] #boot-splash { background: #0f1420; color: #e7ecf6; }
    @media (prefers-color-scheme: dark) {
      html:not([data-theme="light"]) #boot-splash { background: #0f1420; color: #e7ecf6; }
    }
    #boot-splash.is-leaving { opacity: 0; transform: scale(1.02); pointer-events: none; }
    @keyframes boot-autohide { to { opacity: 0; visibility: hidden; pointer-events: none; } }
    .boot-card { display: flex; flex-direction: column; align-items: center; padding: 8px 16px 24px; }
    .boot-ring {
      width: 62px; height: 62px; border-radius: 19px;
      display: grid; place-items: center;
      background: linear-gradient(135deg, #4f46e5, #7c73f0);
      box-shadow: 0 12px 30px rgba(79, 70, 229, .22);
      animation: boot-breathe 1.9s ease-in-out infinite;
    }
    .boot-ring svg { width: 30px; height: 30px; fill: none; stroke: #fff; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    @keyframes boot-breathe { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-4px) scale(1.035); } }
    .boot-title { margin-top: 20px; font-size: 18px; font-weight: 600; letter-spacing: .02em; }
    .boot-sub { margin-top: 4px; font-size: 11px; color: #94a3b8; }
    .boot-track { position: relative; width: 220px; height: 5px; margin-top: 24px; border-radius: 999px; background: #e5e9f0; overflow: hidden; }
    html[data-theme="dark"] .boot-track { background: #2b3446; }
    .boot-track > i {
      position: absolute; top: 0; left: 0; width: 44%; height: 100%;
      border-radius: 999px; background: linear-gradient(90deg, #4f46e5, #7c73f0);
      animation: boot-slide 1.25s ease-in-out infinite;
    }
    /* 后端把阶段推过来后切成「确定进度」：宽度平滑增长，用户看得到在往前走 */
    .boot-track.is-determinate > i {
      width: var(--boot-pct, 0%);
      animation: none;
      transition: width .32s cubic-bezier(.22,.8,.3,1);
    }
    @keyframes boot-slide { from { transform: translateX(-110%); } to { transform: translateX(240%); } }
    .boot-hint { margin-top: 14px; font-size: 11px; color: #94a3b8; display: flex; align-items: center; justify-content: center; gap: 5px; min-height: 16px; text-align: center; }
    .boot-pct { margin-left: 4px; color: #4f46e5; font-variant-numeric: tabular-nums; }
    html[data-theme="dark"] .boot-pct { color: #a5a0ff; }
    .boot-dots { display: inline-flex; gap: 3px; }
    .boot-dots > i { width: 4px; height: 4px; border-radius: 50%; background: #4f46e5; animation: boot-dot 1s ease-in-out infinite; }
    .boot-dots > i:nth-child(2) { animation-delay: .15s; }
    .boot-dots > i:nth-child(3) { animation-delay: .3s; }
    @keyframes boot-dot { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
    #boot-splash.is-error .boot-track, #boot-splash.is-error .boot-dots { display: none; }
    #boot-splash.is-error .boot-hint { color: #b45309; max-width: 320px; text-align: center; }
    /* 阶段切换时提示文字轻微淡入，避免生硬跳字 */
    .boot-hint.is-changing > span:first-child { animation: boot-text-in .2s ease; }
    @keyframes boot-text-in { from { opacity: .25; transform: translateY(2px); } to { opacity: 1; transform: none; } }
  </style>

  编辑模式（components/editmode.js）：卡片上按住 480ms 进入，body 带 .edit-mode，
  顶部浮出 #editbar（全选 / 迁移到分类 / 删除 / 完成），此时单击卡片 = 切换选中、不打开详情。
  「用切片软件打开」按钮常态高亮，悬停时由 components/quickopen.js 在 body 上弹出 .qpop 二层菜单。

  缩略图耗材色板：cardHtml() 读 m.meta.filamentColors / filamentTypes / colorSource，
  在 .card-media 右下角渲染 .card-colors（最多 6 个 .card-color 圆点 + "+N"）；
  鼠标移入时由 grid.js 把 data-color-tip 渲染成挂 body 的 .color-tip 浮层，显示每个颜色占比。
  颜色由 src/core/model3mf.js 解析 3MF：优先按 Metadata/model_settings.config 里每个零件的
  extruder 槽位去映射 Metadata/project_settings.config 的 filament_colour；找不到零件映射时
  退回展示全部配置色并标 colorSource='project'。色值在进 style 前必须匹配 /^#[0-9a-fA-F]{6}$/。
  旧库记录由 src/core/colors.js 的 backfillFilamentColors() 在启动后异步回填（颜色字段 +
  无克数时的 filamentFaceCounts 面数占比，一次写库触发一次刷新），
  capture 模式下会在 app:ready 之前先跑完以便走查看色板。
  网格模式 hover 时工具条从底部盖满，色板用 transform 上移 30px 让开按钮区（不淡出，
  这样鼠标停在圆点上还能看到「PLA · #FFFFFF」提示）；列表模式常显且不上移。

  模型网站导航：#stats-links 里两个 button[data-url] 的网址是静态常量，改网址直接改本文件。
  点击由 app.js 的 bindWebLinks() 事件委托 → api.openExternal() → 主进程 shell.openExternal
  用系统浏览器打开；不要换成 <a href> 或应用内导航（CSP 只允许 script-src 'self'，且 app://
  页面被导航走会把应用窗口变空白）。它跟随 #stats-bar 的显示开关（设置页「显示统计条」）。

  启动链路：本文件 <head> 内联 CSS 先画出 #boot-splash（首帧可见、pointer-events:none、
  12s 纯 CSS 自动隐藏兜底）→ 主进程 services.init() + 注册 IPC 后推 app:ready
  → preload 的 shelf.whenReady() / api.js 的 whenBackendReady() 放行
  → app.js 首轮刷新完成调 components/boot.js 的 finishBoot() 淡出并移除节点。
  改动画时长要同时改 boot.js 的 HARD_TIMEOUT_MS 与本文件 boot-autohide 的 12s 延迟。

  诊断字段（控制台可读，详见 docs/09-实现说明书.md 附录 A.4 / A.10）：
    window.__printshelfBoot / __printshelfBootApi   启动动画状态与收尾次数
    window.__printshelfRender                      full / patch / lastMs / lastMode / replaced
    window.__printshelfIpc                         bootstrap / query / stats / smartCounts 调用次数
    window.__printshelfMotion                      level / effective / vt / vtFallback / enter / pulse

  图标与动效（详见 docs/10 调研、docs/11 计划书、docs/09 §A.10）：
    #icon-sprite 内的 57 个 <symbol id="i-*"> 由 tools/icons/build-sprite.js 从
    lucide-static v1.73.0（ISC）提取，再由 tools/icons/apply-sprite.js 安装进本文件。
    许可原文在 docs/licenses/LUCIDE-LICENSE.txt。改图标不要手改本文件，重跑生成器。
    设置项 ui.iconSet='lucide'|'legacy'：两套路径共用同一组 id，切换只替换 symbol
    内容（components/icon-set.js），静态 <use href="#i-*"> 与 icon() 都不需要改。
    设置项 ui.motionLevel='full'|'reduced'|'off'：写进 <html> 的 data-motion /
    data-motion-effective，components/motion.js 是所有新增动效的唯一入口。

  网格会按卡片指纹做增量 replaceChild()，所以 cardHtml() 里新增任何可见字段，
  必须同步加进 views/grid.js 的 cardSig()，否则该字段变化时不会重画卡片。

  卡片价格（docs/14）：.card-meta 行右端的 .card-price 徽标显示派生成本，数据来自

          </button>
          <button type="button" class="btn btn-sm web-link" data-url="https://space.snapmaker.cn/zh?tab=home-featured"
                  data-i18n-title="在浏览器打开快造模型空间（space.snapmaker.cn）" title="在浏览器打开快造模型空间（space.snapmaker.cn）">
            <svg class="ico"><use href="#i-printer"/></svg><span data-i18n="快造空间">快造空间</span>
            <svg class="ico web-link-ext"><use href="#i-external"/></svg>
          </button>
        </div>
      </div>

      <!-- 主界面常驻打印监控条：components/monitorbar.js 按 printers:update 增量渲染。
           没配置打印机、或在「设置 → 打印监控」里关掉时整条 hidden，不占布局。 -->
      <div id="monitor-bar" class="monitor-bar" hidden>
        <div class="mon-headbar">
          <span class="mon-title"><svg class="ico"><use href="#i-printer"/></svg><span data-i18n="打印监控">打印监控</span></span>
          <span class="mon-live" data-i18n="暂无打印任务">暂无打印任务</span>
          <span class="mon-count"></span>
          <span class="mon-note" hidden></span>
          <span class="mon-spacer"></span>
          <button type="button" class="mon-link" data-mon-act="chart-first" data-i18n="看曲线">看曲线</button>
          <button type="button" class="mon-link" data-mon-act="settings" data-i18n="监控设置">监控设置</button>
        </div>
        <div class="mon-list"></div>
      </div>

      <div id="scan-progress" class="scan-progress" hidden>
        <div class="scan-progress-top"><span id="scan-label" data-i18n="正在扫描…">正在扫描…</span><span id="scan-percent"></span></div>
        <div class="progress-track"><div id="scan-bar" class="progress-fill"></div></div>
      </div>

      <div id="content" class="content-grid"></div>

      <div id="empty-state" class="empty-state" hidden>
        <img src="assets/empty-library.svg" alt="" class="empty-illustration">
        <h2 id="empty-title" data-i18n="这里还没有模型">这里还没有模型</h2>
        <p id="empty-desc" data-i18n="添加一个本机文件夹，PrintShelf 会自动扫描其中的 .3mf 文件并生成缩略图。">添加一个本机文件夹，PrintShelf 会自动扫描其中的 .3mf 文件并生成缩略图。</p>
        <div class="empty-actions">
          <button id="empty-add" class="btn btn-primary"><svg class="ico"><use href="#i-plus"/></svg><span data-i18n="添加模型文件夹">添加模型文件夹</span></button>
          <button id="empty-demo" class="btn btn-ghost" data-i18n="扫描工作区示例">扫描工作区示例</button>
          <button id="empty-models-add" class="btn btn-primary" hidden><svg class="ico"><use href="#i-folder"/></svg><span data-i18n="手动添加模型">手动添加模型</span></button>
        </div>
        <p class="empty-hint" data-i18n="也可以直接把文件夹或 .3mf 文件拖进窗口">也可以直接把文件夹或 .3mf 文件拖进窗口</p>
      </div>
    </main>

    <aside id="detail" class="detail" hidden>
      <header class="detail-head">
        <h2 data-i18n="模型详情">模型详情</h2>
        <button id="detail-close" class="icon-btn" data-i18n-title="关闭详情 (Esc)" title="关闭详情 (Esc)"><svg class="ico"><use href="#i-close"/></svg></button>
      </header>
      <div id="detail-body" class="detail-body"></div>
    </aside>
  </div>

  <!-- 状态栏 -->
  <footer id="statusbar">
    <span id="status-text" class="status-left"><span class="status-dot"></span>就绪</span>
    <span id="status-selection"></span>
    <span class="status-spacer"></span>
    <span id="status-count"></span>
    <span id="status-datadir" class="status-dir" data-i18n-title="点击打开数据目录" title="点击打开数据目录"></span>
  </footer>
</div>

<!-- ============ 浮层 ============ -->
<div id="bulkbar" class="bulkbar" hidden>
  <div class="bulk-left"><strong id="bulk-count">0</strong><span data-i18n="项已选中">项已选中</span></div>
  <div class="bulk-actions">
    <button id="bulk-category" class="btn btn-ghost btn-sm" data-i18n-title="把选中的模型迁移到一个分类" title="把选中的模型迁移到一个分类"><svg class="ico"><use href="#i-folder"/></svg><span data-i18n="迁移">迁移</span></button>
    <button id="bulk-tag" class="btn btn-ghost btn-sm"><svg class="ico"><use href="#i-tag"/></svg><span data-i18n="加标签">加标签</span></button>
    <button id="bulk-status" class="btn btn-ghost btn-sm"><svg class="ico"><use href="#i-printer"/></svg><span data-i18n="打印状态">打印状态</span></button>
    <button id="bulk-fav" class="btn btn-ghost btn-sm"><svg class="ico"><use href="#i-star"/></svg><span data-i18n="收藏">收藏</span></button>
    <span class="bulk-sep"></span>
    <button id="bulk-open" class="btn btn-ghost btn-sm" data-i18n-title="批量送入切片软件" title="批量送入切片软件"><svg class="ico"><use href="#i-printer"/></svg><span data-i18n="打开">打开</span></button>
    <button id="bulk-remove" class="btn btn-ghost btn-sm" data-i18n-title="移出索引：只从库中移除，磁盘文件保留" title="移出索引：只从库中移除，磁盘文件保留"><svg class="ico"><use href="#i-minus"/></svg><span data-i18n="移出索引">移出索引</span></button>
    <button id="bulk-delete" class="btn btn-ghost btn-sm danger" data-i18n-title="删除：把磁盘文件移入系统回收站" title="删除：把磁盘文件移入系统回收站"><svg class="ico"><use href="#i-trash"/></svg><span data-i18n="删除">删除</span></button>
    <button id="bulk-clear" class="icon-btn" data-i18n-title="取消选择" title="取消选择"><svg class="ico"><use href="#i-close"/></svg></button>
  </div>
</div>

<div id="toast-container" class="toast-container" aria-live="polite"></div>
<div id="context-menu" class="context-menu" hidden></div>
<div id="modal-root"></div>

<div id="lightbox" class="lightbox" hidden>
  <button id="lightbox-close" class="lightbox-close icon-btn" data-i18n-title="关闭 (Esc)" title="关闭 (Esc)"><svg class="ico"><use href="#i-close"/></svg></button>
  <button id="lightbox-prev" class="lightbox-nav prev" data-i18n-title="上一个 (←)" title="上一个 (←)"><svg class="ico"><use href="#i-chevron-left"/></svg></button>
  <img id="lightbox-img" src="" alt="模型预览">
  <button id="lightbox-next" class="lightbox-nav next" data-i18n-title="下一个 (→)" title="下一个 (→)"><svg class="ico"><use href="#i-chevron-right"/></svg></button>
  <div id="lightbox-caption" class="lightbox-caption"></div>
</div>

<div id="settings-panel" class="overlay settings-overlay" hidden>
  <div class="settings-window">
    <header class="settings-head">
      <h2><svg class="ico"><use href="#i-settings"/></svg><span data-i18n="设置">设置</span></h2>
      <button id="settings-close" class="icon-btn" data-i18n-title="关闭 (Esc)" title="关闭 (Esc)"><svg class="ico"><use href="#i-close"/></svg></button>
    </header>
    <div class="settings-layout">
      <nav id="settings-nav" class="settings-nav"></nav>
      <div id="settings-content" class="settings-content"></div>
    </div>
  </div>
</div>

<div id="devices-panel" class="overlay devices-overlay" hidden>
  <div class="devices-window">
    <header class="devices-head">
      <h2><svg class="ico"><use href="#i-printer"/></svg><span data-i18n="设备">设备</span></h2>
      <span class="devices-head-sub" data-i18n="快造 / 拓竹，局域网直连">快造 / 拓竹，局域网直连</span>
      <button id="devices-close" class="icon-btn" data-i18n-title="关闭 (Esc)" title="关闭 (Esc)"><svg class="ico"><use href="#i-close"/></svg></button>
    </header>
    <div id="devices-body" class="devices-body"></div>
  </div>
</div>

<div id="filaments-panel" class="overlay filaments-overlay" hidden>
  <div class="fil-window">
    <header class="fil-head">
      <h2><svg class="ico"><use href="#i-box"/></svg><span data-i18n="耗材管理">耗材管理</span></h2>
      <span class="fil-head-sub" data-i18n="耗材库存记录你真正拥有的耗材；耗材库是选购与比价参考">耗材库存记录你真正拥有的耗材；耗材库是选购与比价参考</span>
      <button id="filaments-close" class="icon-btn" data-i18n-title="关闭 (Esc)" title="关闭 (Esc)"><svg class="ico"><use href="#i-close"/></svg></button>
    </header>
    <div id="filaments-body" class="fil-body"></div>
  </div>
</div>

<div id="drag-mask" class="drag-mask" hidden>
  <div class="drag-mask-inner">
    <svg class="ico"><use href="#i-upload"/></svg>
    <strong data-i18n="松开即可添加">松开即可添加</strong>
    <span data-i18n="支持文件夹或 .3mf 文件">支持文件夹或 .3mf 文件</span>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
