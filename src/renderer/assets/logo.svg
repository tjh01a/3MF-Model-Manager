<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="PrintShelf">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 渐变圆角方形底板 -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#brand)"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#sheen)"/>

  <!-- 白色层叠立方体 / 图层线条 -->
  <g fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M64 34 L96 51 L64 68 L32 51 Z" fill="#ffffff" fill-opacity="0.16"/>
    <path d="M32 68 L64 85 L96 68"/>
    <path d="M32 85 L64 102 L96 85"/>
  </g>
</svg>
